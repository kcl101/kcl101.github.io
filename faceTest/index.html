<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FaceCap Photo Prototype</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:rgba(0,0,0,.8);
    padding:12px;
    border-radius:12px;
    color:white;
}

#video{
    width:280px;
    transform:scaleX(-1);
    display:block;
    border-radius:8px;
}

button{
    width:280px;
    margin-top:8px;
    height:42px;
    cursor:pointer;
}

#status{
    margin-top:8px;
    font-size:14px;
}

#debugFace{
    width:280px;
    margin-top:8px;
    border-radius:8px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>

</head>
<body>

<div id="ui">

<video
id="video"
autoplay
playsinline
muted
></video>

<button id="captureBtn">
Take Photo And Apply Face
</button>

<div id="status">
Loading...
</div>

<img id="debugFace"/>

</div>

<canvas id="captureCanvas" style="display:none"></canvas>

<script type="module">

import * as THREE from "three";

import {
OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
KTX2Loader
} from "three/addons/loaders/KTX2Loader.js";

import {
MeshoptDecoder
} from "three/addons/libs/meshopt_decoder.module.js";

import {
    FaceLandmarker,
    FilesetResolver
}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video =
document.getElementById("video");

const captureBtn =
document.getElementById("captureBtn");

const statusEl =
document.getElementById("status");

const debugFace =
document.getElementById("debugFace");

const captureCanvas =
document.getElementById("captureCanvas");

const captureCtx =
captureCanvas.getContext("2d");

let faceMesh = null;

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x222222);

const camera =
new THREE.PerspectiveCamera(
35,
window.innerWidth/window.innerHeight,
0.01,
100
);

camera.position.set(
0,
0,
2.6
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const controls =
new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x666666,
2
)
);

const dirLight =
new THREE.DirectionalLight(
0xffffff,
2
);

dirLight.position.set(
2,2,3
);

scene.add(
dirLight
);

const gltfLoader =
new GLTFLoader();

gltfLoader.setMeshoptDecoder(
MeshoptDecoder
);

const ktx2Loader =
new KTX2Loader();

ktx2Loader.setTranscoderPath(
"https://unpkg.com/three@0.170.0/examples/jsm/libs/basis/"
);

gltfLoader.setKTX2Loader(
ktx2Loader
);

statusEl.innerText =
"Loading facecap.glb...";

gltfLoader.load(
"./facecap.glb",

(gltf)=>{

scene.add(
gltf.scene
);

gltf.scene.traverse(

(obj)=>{

if(
!obj.isMesh
) return;

const count =
obj.geometry.attributes.position.count;

console.log(
obj.name,
count
);

if(
count === 2694
){

faceMesh =
obj;

window.faceMesh =
obj;

console.log(
"FOUND FACECAP FACE",
obj
);

statusEl.innerText =
"FaceCap Ready";



    const oldUv =
obj.geometry.attributes.uv;

const fixedUv =
new Float32Array(
    oldUv.count * 2
);

for(
    let i=0;
    i<oldUv.count*2;
    i++
){
    fixedUv[i] =
    oldUv.array[i] / 4096;
}

obj.geometry.setAttribute(
    "uv",
    new THREE.BufferAttribute(
        fixedUv,
        2
    )
);
}

});

}
);

const vision =
await FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
);

const faceLandmarker =
await FaceLandmarker.createFromOptions(
    vision,
    {
        baseOptions:{
            modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
        },
        outputFaceBlendshapes:false,
        runningMode:"IMAGE",
        numFaces:1
    }
);

const stream =
await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user",
width:1280,
height:720
}
});

video.srcObject =
stream;

statusEl.innerText =
"Camera Ready";

captureBtn.onclick =
async ()=>{

if(!faceMesh){

alert(
"FaceCap not loaded"
);

return;
}

captureCanvas.width =
video.videoWidth;

captureCanvas.height =
video.videoHeight;

captureCtx.drawImage(
video,
0,
0
);

statusEl.innerText =
"Detecting face...";

const result =
await faceLandmarker.detect(
    captureCanvas
);

if(
    !result.faceLandmarks ||
    result.faceLandmarks.length === 0
){
    alert("No face detected");
    return;
}

const landmarks =
result.faceLandmarks[0];

let minX = Infinity;
let minY = Infinity;
let maxX = -Infinity;
let maxY = -Infinity;

for(const p of landmarks){

    const x =
    p.x * captureCanvas.width;

    const y =
    p.y * captureCanvas.height;

    minX = Math.min(minX,x);
    minY = Math.min(minY,y);
    maxX = Math.max(maxX,x);
    maxY = Math.max(maxY,y);
}

const padX =
(maxX-minX)*0.3;

const padY =
(maxY-minY)*0.4;

minX -= padX;
maxX += padX;

minY -= padY;
maxY += padY;

const cropW =
maxX-minX;

const cropH =
maxY-minY;

const faceCanvas =
document.createElement("canvas");

faceCanvas.width = 1024;
faceCanvas.height = 1024;

const faceCtx =
faceCanvas.getContext("2d");

faceCtx.fillStyle="#808080";
faceCtx.fillRect(
    0,
    0,
    1024,
    1024
);

const centerX = (minX + maxX) * 0.5;
const centerY =
(minY + maxY) * 0.5;

// 放大倍率
const size =
Math.max(cropW, cropH) * 0.65;

const sx = centerX - size * 0.5;
const sy = centerY - size * 0.5;
const sw = size;
const sh = size;

faceCtx.drawImage(
    captureCanvas,
    sx,
    sy,
    sw,
    sh,
    0,
    0,
    1024,
    1024
);

faceCtx.globalCompositeOperation =
"destination-in";

faceCtx.beginPath();

faceCtx.ellipse(
    512,
    512,
    470,
    500,
    0,
    0,
    Math.PI * 2
);

faceCtx.fill();

captureCtx.strokeStyle="red";
captureCtx.lineWidth=8;

captureCtx.strokeRect(
    minX,
    minY,
    cropW,
    cropH
);
    faceCtx.filter = "blur(8px)";

debugFace.src =
faceCanvas.toDataURL();

const atlas =
document.createElement("canvas");

atlas.width = 4096;
atlas.height = 4096;

const atlasCtx =
atlas.getContext("2d");
    
atlasCtx.fillStyle =
"#808080";

atlasCtx.fillRect(
    0,
    0,
    4096,
    4096
);

atlasCtx.drawImage(
    faceCanvas,
    1150,
    1950,
    1800,
    2200
);

    
const texture =
new THREE.CanvasTexture(
    atlas
);

texture.flipY = false;
texture.needsUpdate = true;

console.log(
"Applying Texture"
);

if(
Array.isArray(
faceMesh.material
)
){

faceMesh.material.forEach(
(mat)=>{

mat.map =
texture;

mat.needsUpdate =
true;

}
);

}else{

/*const oldUv = faceMesh.geometry.attributes.uv;

const newUv = new Float32Array(oldUv.count * 2);

for(let i=0;i<oldUv.count*2;i++){
    newUv[i] = oldUv.array[i] / 4096;
}

faceMesh.geometry.setAttribute(
    'uv',
    new THREE.BufferAttribute(newUv, 2)
);*/

faceMesh.material.map = texture;
faceMesh.material.needsUpdate = true;
    
}
};

function morph(
name,
value
){

if(
!faceMesh
) return;

const dict =
faceMesh.morphTargetDictionary;

if(
!dict
) return;

if(
dict[name]===undefined
) return;

faceMesh
.morphTargetInfluences[
dict[name]
] = value;

}

const clock =
new THREE.Clock();

function animate(){

requestAnimationFrame(
animate
);

controls.update();

const t =
clock.getElapsedTime();

morph(
"jawOpen",
(Math.sin(t*2)+1)*0.5
);

morph(
"eyeBlink_L",
Math.max(
0,
Math.sin(t*4)
)
);

morph(
"eyeBlink_R",
Math.max(
0,
Math.sin(t*4)
)
);

morph(
"mouthSmile_L",
(Math.sin(t)+1)*0.3
);

morph(
"mouthSmile_R",
(Math.sin(t)+1)*0.3
);

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
