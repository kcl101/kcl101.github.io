<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FaceCap Prototype</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:sans-serif;
}

#ui{
    position:absolute;
    z-index:100;
    left:10px;
    top:10px;
    background:rgba(0,0,0,.7);
    padding:10px;
    border-radius:10px;
    color:white;
}

#video{
    width:240px;
    display:block;
    transform:scaleX(-1);
}

button{
    margin-top:8px;
    width:240px;
    height:40px;
}

#captureCanvas{
    display:none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="ui">

<video
id="video"
autoplay
playsinline
muted
></video>

<button id="takePhoto">
Take Photo
</button>

<div id="status">
Starting...
</div>

</div>

<canvas id="captureCanvas"></canvas>

<script type="module">

import * as THREE from "three";

import {
OrbitControls
}
from "three/addons/controls/OrbitControls.js";

import {
GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";

import {
KTX2Loader
}
from "three/addons/loaders/KTX2Loader.js";

import {
MeshoptDecoder
}
from "three/addons/libs/meshopt_decoder.module.js";

import {
FaceDetector,
FilesetResolver
}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video =
document.getElementById("video");

const button =
document.getElementById("takePhoto");

const status =
document.getElementById("status");

const captureCanvas =
document.getElementById("captureCanvas");

const captureCtx =
captureCanvas.getContext("2d");

let faceMesh = null;

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x222222);

const camera =
new THREE.PerspectiveCamera(
35,
window.innerWidth/window.innerHeight,
0.01,
100
);

camera.position.set(
0,
0,
2.5
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const controls =
new OrbitControls(
camera,
renderer.domElement
);

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x666666,
2
)
);

const dir =
new THREE.DirectionalLight(
0xffffff,
2
);

dir.position.set(
2,
2,
3
);

scene.add(dir);

const loader =
new GLTFLoader();

loader.setMeshoptDecoder(
MeshoptDecoder
);

const ktx2 =
new KTX2Loader();

ktx2.setTranscoderPath(
"https://unpkg.com/three@0.170.0/examples/jsm/libs/basis/"
);

loader.setKTX2Loader(
ktx2
);

loader.load(
"./facecap.glb",

(gltf)=>{

scene.add(
gltf.scene
);

gltf.scene.traverse(
obj=>{

if(
!obj.isMesh
) return;

if(
obj.morphTargetDictionary &&
Object.keys(
obj.morphTargetDictionary
).length
){

faceMesh = obj;

console.log(
"Found face mesh:",
obj.name
);

status.innerText =
"FaceCap loaded";
}
});
}
);

const vision =
await FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
);

const detector =
await FaceDetector.createFromOptions(
vision,
{
baseOptions:{
modelAssetPath:
"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite"
}
}
);

const stream =
await navigator.mediaDevices.getUserMedia({
video:{
width:1280,
height:720,
facingMode:"user"
}
});

video.srcObject =
stream;

button.onclick =
async ()=>{

if(!faceMesh)
{
alert("FaceCap not loaded yet");
return;
}

captureCanvas.width =
video.videoWidth;

captureCanvas.height =
video.videoHeight;

captureCtx.drawImage(
video,
0,
0
);

status.innerText =
"Detecting face...";

const result =
await detector.detect(
captureCanvas
);

if(
!result.detections ||
!result.detections.length
){
alert(
"No face detected"
);
return;
}

const box =
result.detections[0]
.boundingBox;

const textureCanvas =
document.createElement(
"canvas"
);

textureCanvas.width =
1024;

textureCanvas.height =
1024;

const texCtx =
textureCanvas.getContext("2d");

texCtx.fillStyle =
"#808080";

texCtx.fillRect(
0,
0,
1024,
1024
);

texCtx.drawImage(

captureCanvas,

box.originX,
box.originY,
box.width,
box.height,

180,
120,
650,
780
);

const texture =
new THREE.CanvasTexture(
textureCanvas
);

texture.needsUpdate =
true;

texture.flipY = false;

faceMesh.material =
new THREE.MeshStandardMaterial({

map:texture,

roughness:1,

metalness:0

});

status.innerText =
"Face texture applied";
};

const clock =
new THREE.Clock();

function morph(
name,
value
){

if(!faceMesh) return;

const dict =
faceMesh.morphTargetDictionary;

if(
dict[name] === undefined
) return;

faceMesh
.morphTargetInfluences[
dict[name]
] = value;
}

function animate(){

requestAnimationFrame(
animate
);

const t =
clock.getElapsedTime();

morph(
"jawOpen",
(Math.sin(t*2)+1)*0.5
);

morph(
"eyeBlink_L",
Math.max(
0,
Math.sin(t*4)
)
);

morph(
"eyeBlink_R",
Math.max(
0,
Math.sin(t*4)
)
);

morph(
"mouthSmile_L",
(Math.sin(t)+1)*0.3
);

morph(
"mouthSmile_R",
(Math.sin(t)+1)*0.3
);

renderer.render(
scene,
camera
);
}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
